[build]
  command = "cd frontend && npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "18"

[functions]
  directory = "netlify/functions"

# SPA fallback - Netlify functions at /.netlify/functions/* are handled automatically
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
