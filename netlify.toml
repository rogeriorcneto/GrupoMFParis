[build]
  command = "cd frontend && npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "18"
  VITE_BOT_URL = "https://grupomfparis-production.up.railway.app"

[functions]
  directory = "netlify/functions"

# SPA fallback - Netlify functions at /.netlify/functions/* are handled automatically
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
